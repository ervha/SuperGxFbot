<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>システム管理</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

<div class="menu-wrapper">
    <button class="btn-menu" id="menuBtn" title="メニュー">☰</button>
    <div class="dropdown-menu" id="dropdownMenu">
        <a href="index.html" class="dropdown-item">部屋管理</a>
        <a href="log.html" class="dropdown-item">ログ</a>
        <a href="admin.html" class="dropdown-item">システム</a>
    </div>
</div>

<div class="container log-container">
    <h1>システム管理・メンテナンス</h1>

    <div id="alertMsg" style="display: none;"></div>

    <div class="admin-card">
        <h2>現在のシステムステータス</h2>
        <div class="admin-status">
            <div class="status-item">
                <div>保持されている部屋数</div>
                <div class="status-number" id="roomCount">- 件</div>
            </div>
            <div class="status-item">
                <div>蓄積されたログ件数</div>
                <div class="status-number" id="logCount">- 件</div>
            </div>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-actions">
            <h3>変更履歴ログの初期化</h3>
            <p style="font-size: 0.9rem; color: #8b949e; margin-bottom: 15px;">
                データベース内の room_logs テーブルを完全に空にします。過去の登録・削除の履歴データはすべて削除されます。
            </p>
            <button type="button" class="btn-danger" onclick="executeAdminAction('clear_logs', '本当にログ履歴をすべて初期化してもよろしいですか？この操作は取り消せません。')">ログ履歴をすべて初期化</button>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-actions">
            <h3>アクティブ部屋情報の一括クリア</h3>
            <p style="font-size: 0.9rem; color: #8b949e; margin-bottom: 15px;">
                現在画面に表示されているすべての部屋データを強制的に一括削除します。
            </p>
            <button type="button" class="btn-danger" onclick="executeAdminAction('clear_rooms', '現在保持されているすべての部屋データをクリアしますか？')">部屋データを一括クリア</button>
        </div>
    </div>
</div>

<script>
const menuBtn = document.getElementById('menuBtn');
const dropdownMenu = document.getElementById('dropdownMenu');
const alertMsg = document.getElementById('alertMsg');

menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownMenu.classList.toggle('show');
});

document.addEventListener('click', (e) => {
    if (!dropdownMenu.contains(e.target) && e.target !== menuBtn) {
        dropdownMenu.classList.remove('show');
    }
});

async function loadStatus() {
    try {
        const res = await fetch('/api/admin/status');
        const data = await res.json();
        if (data.status === 'success') {
            document.getElementById('roomCount').innerText = data.room_count + ' 件';
            document.getElementById('logCount').innerText = data.log_count + ' 件';
        }
    } catch (e) {
        console.error(e);
    }
}

async function executeAdminAction(action, confirmPrompt) {
    if (!confirm(confirmPrompt)) return;

    try {
        const res = await fetch('/api/admin/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
        });
        const data = await res.json();

        alertMsg.style.display = 'block';
        if (data.status === 'success') {
            alertMsg.className = 'alert-success';
            alertMsg.innerText = data.message;
        } else {
            alertMsg.className = 'alert-error';
            alertMsg.innerText = data.error || 'エラーが発生しました';
        }
        await loadStatus();
    } catch (e) {
        alertMsg.style.display = 'block';
        alertMsg.className = 'alert-error';
        alertMsg.innerText = '通信エラーが発生しました';
    }
}

loadStatus();
</script>
</body>
</html>
